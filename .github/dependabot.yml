version: 2
updates:
  # Keep pinned CI deps current — opens PRs that re-fire the gate matrix.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps"
    groups:
      # Transitive dev tooling — patch + minor bundled into one weekly PR.
      dev-tools:
        patterns:
          - "pytest"
          - "keyring"
          - "jsonschema"
          - "httpx"
        update-types:
          - "patch"
          - "minor"
      # cryptography stays in its own slot. Major bumps are NOT grouped so
      # they always land standalone — gives the review path space to walk
      # the changelog for signing-path impact.
      security-critical:
        patterns:
          - "cryptography"
        update-types:
          - "patch"
          - "minor"

  # Keep GitHub Actions versions current (setup-python, checkout, etc).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      # Both checkout + setup-python bumps collapse into a single weekly CI PR.
      ci-actions:
        patterns:
          - "*"
