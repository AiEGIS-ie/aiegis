name: pre-push-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install test deps (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Install SDK (editable) so test suites can import aiegis_agent
        run: |
          if [ -d sdk ]; then python -m pip install -e ./sdk; fi

      - name: Run pre-push gate (skip live-VPS gates in CI)
        env:
          AIEGIS_PUBLIC_PREP_DIR: ${{ github.workspace }}
          AIEGIS_BUNDLE_DIR: ${{ github.workspace }}/compliance-bundle
          AIEGIS_PYTHON: ${{ steps.setup-python.outputs.python-path || 'python' }}
          AIEGIS_SKIP_LIVE: '1'
        run: bash scripts/pre_push_gate.sh

  live-gates:
    # Gates (v)–(viii) hit aiegis.ie — only required on push-to-main so a transient
    # VPS outage doesn't red the entire PR queue. Allowed to fail on PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run live-VPS gates only
        run: |
          set -e
          curl -fsI https://aiegis.ie >/dev/null
          curl -fsI https://aiegis.ie/api/health >/dev/null
          bash scripts/verify_jsonld_contexts.sh
          echo "live-gates OK"
