[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiegis-agent-sdk"
version = "0.6.3"
description = "AiEGIS Agent SDK — one-line did:aiegis identity for AI agents (LangChain, OpenAI, Anthropic, CrewAI, Vercel AI SDK)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AiEGIS", email = "hello@aiegis.ie" }]
keywords = ["ai", "agent", "identity", "did", "aiegis", "verifiable-credentials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "keyring>=24.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.3"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
crewai = ["crewai>=0.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
aiegis-agent = "aiegis_agent.__main__:main"

[project.urls]
Homepage = "https://aiegis.ie"
Documentation = "https://aiegis.ie/developer"
Repository = "https://github.com/AiEGIS-ie/aiegis"
Issues = "https://github.com/AiEGIS-ie/aiegis/issues"
Changelog = "https://github.com/AiEGIS-ie/aiegis/blob/main/CHANGELOG.md"
Security = "https://github.com/AiEGIS-ie/aiegis/blob/main/SECURITY.md"
Specification = "https://github.com/AiEGIS-ie/aiegis/tree/main/spec"

[tool.setuptools]
packages = ["aiegis_agent"]

[tool.setuptools.package-data]
aiegis_agent = ["py.typed"]
